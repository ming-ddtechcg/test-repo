apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: myapp
  name: myapp
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: myapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myapp
    spec:
      containers:
        - name: myapp
          image: harbor.ddtechcg.com:5001/playground/myapp:test
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - "chmod +x /control.sh; . /control.sh"
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              cpu: 350m
              memory: 256Mi
      serviceAccount: myapp
      serviceAccountName: myapp
