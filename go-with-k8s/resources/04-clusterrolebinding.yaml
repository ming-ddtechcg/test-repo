apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: myapp
  name: myapp-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  #name: myapp-clusterrole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: myapp
  namespace: dev
